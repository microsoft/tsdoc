# Pipeline: tsdoc npm bump-versions
#
# Trigger: automatically when change files merge to "main".
# Purpose: build the repo, apply the pending "rush change" files to bump versions and CHANGELOGs,
#          pack the resulting tarballs, and open a PR with the version bump. Pushing the bump commit
#          directly to "main" is blocked by branch protection, so the bump goes through a PR instead.
#          The packed tarballs are published by the "npm-release.yaml" pipeline once that PR merges.
#
# The run is tagged "bump-versions|<bumpCommitSha>" so the release pipeline can locate the packed
# tarballs that correspond to the merged PR.

trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    include:
      - 'common/changes/*'
      - 'common/config/azure-pipelines/**'

pr: none

variables:
  - name: FORCE_COLOR
    value: 1
  - name: RepoPath
    value: '$(Agent.BuildDirectory)/tsdoc'
  - name: FeatureBranch
    value: 'automated/bump-versions'

resources:
  repositories:
    - repository: RushstackMainRepo
      type: github
      name: Microsoft/rushstack
      endpoint: 'GitHub (Rushbot)'
    - repository: 1esPipelines
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      os: windows
    sdl:
      sourceRepositoriesToScan:
        include:
          - repository: RushstackMainRepo
    stages:
      - stage: BumpVersions
        displayName: 'Bump Versions and Create PR'
        jobs:
          - job: BumpVersions
            displayName: 'Bump Versions'
            pool:
              name: publish-rushstack
              os: linux
            templateContext:
              outputParentDirectory: $(Build.ArtifactStagingDirectory)
              outputs:
                - output: pipelineArtifact
                  targetPath: $(Build.ArtifactStagingDirectory)/packages
                  artifactName: packages
                - output: pipelineArtifact
                  targetPath: $(Build.ArtifactStagingDirectory)/published-versions
                  artifactName: published-versions
                - output: pipelineArtifact
                  targetPath: $(Build.ArtifactStagingDirectory)/json-schemas
                  artifactName: json-schemas
            steps:
              - checkout: self
                persistCredentials: true
                path: tsdoc

              - template: /common/config/azure-pipelines/templates/create-feature-branch.yaml@self
                parameters:
                  FeatureBranch: $(FeatureBranch)

              - template: /common/config/azure-pipelines/templates/install-node.yaml@self

              - template: /common/config/azure-pipelines/templates/build.yaml@self

              - template: /common/config/azure-pipelines/templates/bump-versions.yaml@self

              - template: /common/config/azure-pipelines/templates/pack.yaml@self

              - template: /common/config/azure-pipelines/templates/post-publish.yaml@self

              - template: /common/config/azure-pipelines/templates/push-and-create-github-pr.yaml@self
                parameters:
                  BranchName: $(FeatureBranch)
                  PrTitle: 'Bump package versions'
                  PrDescription: |
                    Automated version bump generated by the tsdoc publishing pipeline.

                    Merging this PR publishes the bumped packages to npm.

                    Pipeline Run: $(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)

              - bash: |
                  set -euo pipefail
                  BUMP_SHA=$(git rev-parse HEAD)
                  echo "##vso[build.addbuildtag]bump-versions|${BUMP_SHA}"
                  echo "Tagged build with bump commit SHA: ${BUMP_SHA}"
                displayName: 'Tag build with bump commit SHA'
                condition: and(succeeded(), eq(variables['HasChanges'], 'true'))
                workingDirectory: $(RepoPath)

              - bash: |
                  mkdir -p "$(Build.ArtifactStagingDirectory)/packages"
                  mkdir -p "$(Build.ArtifactStagingDirectory)/published-versions"
                  mkdir -p "$(Build.ArtifactStagingDirectory)/json-schemas"
                displayName: 'Ensure artifact staging directories exist'
                condition: always()
