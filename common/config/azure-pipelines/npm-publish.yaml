# TEMPORARY pipeline (throwaway branch "temp/cla-signoff-pr491").
#
# Purpose: sign the Microsoft CLA on the automated bump PR (microsoft/tsdoc#491) AS the Azure
# Pipelines GitHub user. That user authored the PR's commits, so it must post the CLA agreement
# comment itself. Running this pipeline (via the GitHub service connection, whose credentials are
# persisted into the checkout) posts the comment as that user.
#
# This replaces the normal bump-versions pipeline on this temporary branch only. Do NOT merge this
# branch. Queue it manually against the "microsoft" remote, then delete the branch.

trigger: none
pr: none

variables:
  - name: FORCE_COLOR
    value: 1

resources:
  repositories:
    - repository: 1esPipelines
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      os: windows
    stages:
      - stage: SignCla
        displayName: 'Sign CLA on the bump PR'
        jobs:
          - job: SignCla
            displayName: 'Post CLA agreement comment'
            pool:
              name: publish-rushstack
              os: linux
            steps:
              - checkout: self
                persistCredentials: true
                path: tsdoc

              - bash: |
                  set -euo pipefail

                  # Reuse the auth header that AzDO injects into the checkout's git config for the
                  # GitHub service connection, so the comment is posted as the Azure Pipelines user
                  # without configuring any extra secret or PAT.
                  AUTH_HEADER=$(git config --get-regexp 'http\..*\.extraheader' | head -1 | sed 's/^[^ ]* //')
                  if [ -z "$AUTH_HEADER" ]; then
                    echo "##[error]Could not extract authorization header from git config. Ensure persistCredentials is enabled on the checkout step."
                    exit 1
                  fi

                  CURL_CONFIG=$(mktemp)
                  trap 'rm -f "$CURL_CONFIG"' EXIT
                  echo "-H \"${AUTH_HEADER}\"" > "$CURL_CONFIG"
                  echo '-H "Accept: application/vnd.github+json"' >> "$CURL_CONFIG"

                  RESPONSE=$(curl -sS -w "\n%{http_code}" -K "$CURL_CONFIG" -X POST \
                    "https://api.github.com/repos/microsoft/tsdoc/issues/491/comments" \
                    -d "$(jq -n --arg body "$COMMENT_BODY" '{body: $body}')")
                  HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
                  BODY=$(echo "$RESPONSE" | sed '$d')

                  if [[ "$HTTP_CODE" -ge 200 && "$HTTP_CODE" -lt 300 ]]; then
                    echo "Posted CLA agreement comment to microsoft/tsdoc#491"
                  else
                    echo "##[error]GitHub API returned HTTP ${HTTP_CODE}:"
                    echo "$BODY"
                    exit 1
                  fi
                displayName: 'Post CLA agreement comment'
                workingDirectory: $(Agent.BuildDirectory)/tsdoc
                # Pass the comment body via an environment variable (not template expansion) so its
                # quotes are not interpreted as shell/YAML syntax.
                env:
                  COMMENT_BODY: '@microsoft-github-policy-service agree company="Microsoft"'
