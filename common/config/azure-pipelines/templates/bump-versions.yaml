# Applies the pending "rush change" files to bump package versions and update CHANGELOGs, packs the
# resulting tarballs, and commits the version bump on the automated feature branch. Unlike the
# previous flow, this does NOT push to "main" (pushing directly to "main" is blocked) -- the commit
# is opened as a PR instead.
#
# Apply and pack are performed in a single "rush publish" invocation, while the change files are
# still present: "--apply" bumps package.json versions and regenerates CHANGELOG files, "--pack"
# writes an npm tarball per publishable project into the release folder, and "--include-all" ensures
# every "shouldPublish" project is packed. (Running "--pack --include-all" as a separate step after
# the change files were already consumed can produce no tarballs -- see rushstack issue #735.) The
# release pipeline skips any tarball whose version is already on the registry, so unchanged packages
# packed by "--include-all" are never republished.
#
# Because "--target-branch" is omitted, "rush publish" leaves the bumps uncommitted in the working
# tree, which lets us commit exactly those changes ourselves.
parameters:
  - name: RepoPath
    type: string
    default: '$(Agent.BuildDirectory)/tsdoc'

steps:
  - script: >
      node common/scripts/install-run-rush.js publish
      --apply
      --pack
      --include-all
      --release-folder $(Build.ArtifactStagingDirectory)/packages
    displayName: 'Rush Publish (apply version bumps and pack)'
    workingDirectory: ${{ parameters.RepoPath }}

  # Drop tarballs whose version is already on the registry (packed by "--include-all" but unchanged
  # in this bump), so the ESRP publish step only receives packages that need publishing.
  - script: >
      node common/config/azure-pipelines/scripts/filter-unpublished-tarballs.js
      --packages-path $(Build.ArtifactStagingDirectory)/packages
    displayName: 'Filter already-published packages'
    workingDirectory: ${{ parameters.RepoPath }}

  - bash: |
      set -euo pipefail
      git add -u -- common/changes
      git add -- '**/CHANGELOG.md' '**/CHANGELOG.json' '**/package.json'

      if [ -n "$(git diff --cached --numstat)" ]; then
        git commit -m "Applying package version bumps

      Pipeline Run: $(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
        echo "Changes committed"
        echo "##vso[task.setvariable variable=HasChanges]true"
      else
        echo "No version bumps to commit"
        echo "##vso[task.setvariable variable=HasChanges]false"
      fi
    displayName: 'Commit Version Bumps'
    workingDirectory: ${{ parameters.RepoPath }}
