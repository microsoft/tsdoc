name: CI
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        include:
          - NodeVersion: 18.20.x
            NodeVersionDisplayName: 18
            OS: ubuntu-latest
          - NodeVersion: 20.18.x
            NodeVersionDisplayName: 20
            OS: ubuntu-latest
          - NodeVersion: 22.12.x
            NodeVersionDisplayName: 22
            OS: ubuntu-latest
          - NodeVersion: 24.9.x
            NodeVersionDisplayName: 24
            OS: ubuntu-latest
          - NodeVersion: 22.12.x
            NodeVersionDisplayName: 22
            OS: windows-latest
    name: Node.js v${{ matrix.NodeVersionDisplayName }} (${{ matrix.OS }})
    runs-on: ${{ matrix.OS }}
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          fetch-depth: 2

      - name: Git config user
        run: |
          git config --local user.name "Rushbot"
          git config --local user.email "rushbot@users.noreply.github.com"

      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: ${{ matrix.NodeVersion }}

      - name: Verify Change Logs
        run: node common/scripts/install-run-rush.js change --verify

      - name: Rush Install
        run: node common/scripts/install-run-rush.js install

      - name: Rush retest
        run: node common/scripts/install-run-rush.js retest --verbose --production
